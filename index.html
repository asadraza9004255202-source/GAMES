<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Face Match 2.0 - World Twin Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <header>
      <div class="badge">AI RADAR 2.0</div>
      <h1>World Twin Finder</h1>
      <p>Duniya me apne jaise dikhne wale log dhoondhein</p>
    </header>

    <!-- UPLOAD SECTION -->
    <div id="uploadSection" class="upload-box">
      <input type="file" id="photoInput" accept="image/*" hidden>
      <div class="drop-zone" onclick="document.getElementById('photoInput').click()">
        <div id="uploadIcon" class="upload-icon">📸</div>
        <p id="uploadText">Tap karke high-quality photo upload karein</p>
        <img id="previewImg" class="preview-img hidden" alt="Uploaded Photo">
      </div>
      <button id="scanBtn" class="btn scan-btn hidden">⚡ START AI FACIAL SCAN</button>
    </div>

    <!-- CIRCULAR SCANNING ANIMATION SECTION -->
    <div id="scanningSection" class="scanning-box hidden">
      <div class="circle-scanner">
        <div class="pulse-ring"></div>
        <div class="spinner-ring"></div>
        <img id="scanningUserImg" src="" alt="Scanning Target">
        <div class="scan-line"></div>
      </div>
      <h3 id="scanPercent" class="percent-text">0%</h3>
      <p id="scanStatus" class="status-text">Detecting facial features...</p>
    </div>

    <!-- RESULT SECTION -->
    <div id="resultSection" class="result-box hidden">
      <div class="match-badge">99.2% FACE MATCH</div>
      <h2>🎉 Twin Profile Found!</h2>
      <div class="avatar-comparison">
        <div class="avatar-card">
          <img id="userFinalImg" src="" alt="User">
          <span>Aap</span>
        </div>
        <div class="vs-badge">VS</div>
        <div class="avatar-card">
          <img id="twinFinalImg" src="https://picsum.photos/300/300?random=88" alt="Twin">
          <span>Twin (California, USA)</span>
        </div>
      </div>
      <button id="unlockBtn" class="btn unlock-btn">🔓 Unlock Full Profile & Contact</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
